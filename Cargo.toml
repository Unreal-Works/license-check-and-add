[package]
name = "license-check-and-add"
version = "0.2.0"
edition = "2024"
description = "Check, add, or remove license headers from source files"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Unreal-Works/license-check-and-add"
keywords = ["license", "headers", "copyright", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
